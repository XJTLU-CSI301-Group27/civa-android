name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect Android project
        id: android
        shell: bash
        run: |
          if [[ -x ./gradlew ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Android scaffold is not present; build checks are skipped during repository bootstrap."
          fi

      - name: Set up Java
        if: steps.android.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: steps.android.outputs.present == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Build, test, and lint
        if: steps.android.outputs.present == 'true'
        run: ./gradlew assembleDebug testDebugUnitTest lint

      - name: Bootstrap reminder
        if: steps.android.outputs.present == 'false'
        run: |
          echo "::warning::Android project is not configured yet. Add gradlew and remove the bootstrap guard before requiring this check."
