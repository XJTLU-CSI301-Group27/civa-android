[versions]
agp = "8.13.2"
junit = "4.13.2"
appcompat = "1.7.1"
material = "1.12.0"
fragment = "1.8.9"
lifecycle = "2.9.4"
room = "2.8.4"
guava = "33.3.1-jre"
androidx-test-runner = "1.6.2"
androidx-test-junit = "1.2.1"
annotation = "1.9.1"
retrofit = "2.11.0"
okhttp = "4.12.0"
gson = "2.13.2"
jsr305 = "3.0.2"
javax-annotation = "1.3.2"
mockwebserver = "4.12.0"
archunit = "1.5.0"

[libraries]
junit = { module = "junit:junit", version.ref = "junit" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
material = { module = "com.google.android.material:material", version.ref = "material" }
fragment = { module = "androidx.fragment:fragment", version.ref = "fragment" }
lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel", version.ref = "lifecycle" }
lifecycle-livedata = { module = "androidx.lifecycle:lifecycle-livedata", version.ref = "lifecycle" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
annotation = { module = "androidx.annotation:annotation", version.ref = "annotation" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
jsr305 = { module = "com.google.code.findbugs:jsr305", version.ref = "jsr305" }
javax-annotation = { module = "javax.annotation:javax.annotation-api", version.ref = "javax-annotation" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "mockwebserver" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
